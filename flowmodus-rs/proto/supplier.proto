syntax = "proto3";
package flowmodus;

message SupplierDeclaration {
  string supplier_id = 1;
  string supplier_name = 2;
  bool verified = 3;
  int64 updated_at_unix = 4;
  repeated ModelDeclaration models = 5;
  repeated EndpointDeclaration endpoints = 6;
  ComplianceDeclaration compliance = 7;
  RateLimits rate_limits = 8;
}

message ModelDeclaration {
  string model_id = 1;
  string display_name = 2;
  string lang = 3;
  repeated string semantic_tags = 4;
  repeated string agent_roles = 5;
  BillingDeclaration billing = 6;
  KvCacheDeclaration kv_cache = 7;
  CapabilitiesDeclaration capabilities = 8;
  float tokenizer_compression_ratio = 9;
  repeated string capability_tags = 10;
}

message BillingDeclaration {
  string currency = 1;
  float token_input = 2;
  float token_output = 3;
  float compute_ms = 4;
  float audio_sec = 5;
  float video_frame = 6;
  // Superseded by `allowances` (ADR-0103 D2). Kept: removing a field is a different
  // decision, and an old reader has to keep working.
  int32 free_quota_daily = 7;
  // ADR-0103: a rate card is data, not per-supplier code. Both lists default to empty,
  // and empty means the flat fields above are the whole story — so adding them changes
  // no existing quote.
  repeated RateRule rules = 8;
  repeated FreeAllowance allowances = 9;
}

// ADR-0103 D1. 0 is "unspecified", so "absent" stays distinguishable from
// "declared as ...". Value names are prefixed because every file shares package
// `flowmodus`, where proto3 makes enum values package-scoped.
enum BillingUnit {
  BILLING_UNIT_UNSPECIFIED = 0;
  BILLING_UNIT_TOKEN_INPUT = 1;
  BILLING_UNIT_TOKEN_OUTPUT = 2;
  BILLING_UNIT_CACHE_READ_TOKEN = 3;
  BILLING_UNIT_CACHE_WRITE_TOKEN = 4;
  BILLING_UNIT_COMPUTE_MS = 5;
  BILLING_UNIT_AUDIO_SEC = 6;
  BILLING_UNIT_VIDEO_FRAME = 7;
  BILLING_UNIT_REQUEST = 8;
}

enum BillingMode {
  BILLING_MODE_UNSPECIFIED = 0;
  BILLING_MODE_REALTIME = 1;
  BILLING_MODE_BATCH = 2;
}

// UTC and declared, so "the same instant prices the same everywhere" is decidable.
// An absent window, or one with start == end, applies always.
message TimeWindow {
  int32 start_minute_utc = 1;
  int32 end_minute_utc = 2;
  int64 effective_from_unix = 3;
  int64 effective_until_unix = 4;
}

message VolumeTier {
  int64 from_units = 1;  // inclusive
  int64 to_units = 2;    // exclusive; 0 = unbounded
  float price_per_unit = 3;
}

// One line of a rate card. An unconditioned rule is exactly one entry of today's flat
// table, so the flat fields are a special case rather than a parallel mechanism.
message RateRule {
  BillingUnit unit = 1;
  float price_per_unit = 2;
  BillingMode mode = 3;
  TimeWindow window = 4;
  // Peak/off-peak. 0 is treated as unspecified, i.e. neutral (1).
  float window_multiplier = 5;
  repeated VolumeTier tiers = 6;
}

// ADR-0103 D2: an allowance is NOT a price. It reduces the quantity before pricing, and
// it never becomes a charge unless spillover is declared explicitly.
enum AllowanceExhaustPolicy {
  ALLOWANCE_EXHAUST_POLICY_UNSPECIFIED = 0;  // == REFUSE (the strict default)
  ALLOWANCE_EXHAUST_POLICY_REFUSE = 1;
  ALLOWANCE_EXHAUST_POLICY_SPILL_TO_PAID = 2;
}

message FreeAllowance {
  BillingUnit unit = 1;
  int64 quantity = 2;
  int32 reset_minute_utc = 3;
  int32 reset_period_hours = 4;  // 24 = daily; 0 = one-shot, never resets
  AllowanceExhaustPolicy on_exhaust = 5;
}

message KvCacheDeclaration {
  bool supported = 1;
  int32 ttl_seconds = 2;
  string control_parameter = 3;
  string breakpoint_marker = 4;
  bool standard_compliance = 5;
}

message CapabilitiesDeclaration {
  int32 context_window = 1;
  repeated string modalities = 2;
  ToolCallingDeclaration tool_calling = 3;
  StreamingDeclaration streaming = 4;
}

message ToolCallingDeclaration {
  bool supported = 1;
  string schema_format = 2;
}

message StreamingDeclaration {
  bool supported = 1;
  string protocol = 2;
}

message EndpointDeclaration {
  string type = 1;
  string region = 2;
  string base_url = 3;
  string tls_version = 4;
  string auth_method = 5;
  int32 priority = 6;
  string provision_url = 7;
  string documentation_url = 8;
}

message ComplianceDeclaration {
  string data_processing = 1;
  string content_filtering = 2;
  string data_portability = 3;
}

message RateLimits {
  repeated RateLimitTier tiers = 1;
}

message RateLimitTier {
  string tier_name = 1;
  string description = 2;
  int32 rpm = 3;
  int32 tpm = 4;
  int32 rpd = 5;
  int32 tpd = 6;
  int32 max_concurrent = 7;
  string reset_schedule = 8;
  string reset_time_utc = 9;
  repeated string models_included = 10;
  PeakHours peak_hours = 11;
  map<string, ModelRateLimit> model_overrides = 12;
  RateLimitHeaders header_format = 13;
}

message PeakHours {
  bool enabled = 1;
  string timezone = 2;
  string start = 3;
  string end = 4;
  int32 rpm_during_peak = 5;
}

message ModelRateLimit {
  int32 rpm = 1;
  int32 tpm = 2;
}

message RateLimitHeaders {
  string remaining_requests = 1;
  string remaining_tokens = 2;
  string reset_time_sec = 3;
}
