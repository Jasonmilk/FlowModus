[package]
name = "flowmodus"
version = "0.2.0-rs"
edition = "2021"
description = "FlowModus rs — LLM scheduling rule definer (weights-and-measures bureau). Zero Helix dependency."
license = "Apache-2.0"

[dependencies]
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
unicode-normalization = "0.1"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
